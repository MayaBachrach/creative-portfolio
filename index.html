/* Light and dark reference palettes. */

* { box-sizing: border-box; }
body { margin: 0; color: var(--page-text); background: var(--page-background); font: 1.1rem/1.6 var(--font-body, "Heebo", system-ui, sans-serif); }
body:has(dialog[open]) { overflow: hidden; }
h1, h2, h3, p, figure { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-underline-offset: .25em; }
button:focus-visible, a:focus-visible { outline: 3px solid currentColor; outline-offset: 5px; }
.site-header { display: flex; direction: ltr; justify-content: space-between; align-items: center; padding: .5rem var(--gutter); min-height: 62px; }
.site-header a { display: inline-flex; min-height: 44px; align-items: center; }
.wordmark { font-weight: 900; letter-spacing: -.05em; text-decoration: none; }
.hero { color: var(--hero-text); background: var(--hero-background); padding-block: clamp(2rem, 5vw, 5rem) 1rem; overflow: hidden; }
.hero-intro { padding-inline: var(--gutter); }
h1 { display: flex; align-items: baseline; gap: .22em; font-size: clamp(3.2rem, 7.7vw, 8.6rem); line-height: 1.15; letter-spacing: -.055em; font-weight: 900; }
.greeting { flex: 1; display: flex; align-items: center; min-width: 0; overflow: clip; white-space: nowrap; }
.greeting span { display: inline-block; transform-origin: right center; }
.intro-name { flex: none; display: flex; align-items: center; white-space: nowrap; }
.name { color: var(--name-text); display: inline-block; background: var(--name-background); padding-inline: .1em .14em; transform: rotate(-3deg); }
.hero-intro > p { text-align: center; font-size: clamp(1.1rem, 2.15vw, 1.8rem); font-weight: 600; margin-block: 1.1rem 0; }
.carousel { margin-block-start: clamp(2rem, 5vw, 4rem); }
.carousel-window { direction: ltr; overflow: hidden; padding-block: 3rem 2rem; }
.carousel-track { display: flex; direction: ltr; width: max-content; animation: drift var(--carousel-duration, 40s) linear infinite; }
.carousel-set { display: flex; gap: clamp(1.2rem, 3vw, 3rem); padding-inline-end: clamp(1.2rem, 3vw, 3rem); }
.carousel-tile { position: relative; width: clamp(11rem, 22vw, 21rem); aspect-ratio: 1; flex: none; }
.carousel-tile::before { content: ""; position: absolute; inset: -3%; background: var(--star-fill, var(--lime)); clip-path: polygon(50% 0%, 64% 30%, 98% 35%, 74% 57%, 80% 94%, 50% 76%, 20% 94%, 26% 57%, 2% 35%, 36% 30%); transform: rotate(var(--star-angle, -8deg)); }
.carousel-tile img, .carousel-tile video { display: block; width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; }
.carousel-tile:nth-child(3n + 1) { --star-angle: -9deg; }
.carousel-tile:nth-child(3n + 2) { --star-angle: 7deg; }
.carousel-tile:nth-child(3n) { --star-angle: -2deg; }
@keyframes drift { to { transform: translateX(-50%); } }
.carousel.is-paused .carousel-track, .carousel:has(.carousel-tile:focus-visible) .carousel-track { animation-play-state: paused; }
.projects-section { padding: clamp(2.5rem, 6vw, 6rem) var(--gutter); }
.project-grid { display: grid; grid-template-columns: repeat(var(--desktop-columns, 4), minmax(0, 1fr)); gap: clamp(1rem, 2vw, 2rem); }
.project-card .card-content::after { content: ""; pointer-events: none; position: absolute; inset: -9px; background: var(--pencil-outline) center / 100% 100% no-repeat; opacity: 0; transition: opacity 140ms ease; }
.project-card:focus-visible .card-content::after, .project-card.is-in-view .card-content::after { opacity: 1; }
.name-line { display: inline-block; white-space: nowrap; }
.project-page h2:focus { outline: none; }
.project-page { scrollbar-width: thin; scrollbar-color: var(--panel-accent, var(--accent-2)) var(--panel-background); }
.project-page::-webkit-scrollbar { width: 10px; }
.project-page::-webkit-scrollbar-track { background: var(--panel-background); }
.project-page::-webkit-scrollbar-thumb { background: var(--panel-accent, var(--accent-2)); border: 2px solid var(--panel-background); border-radius: 8px; }
.project-card { min-width: 0; position: relative; display: block; background: var(--card-background); color: var(--card-text); padding: 0; text-decoration: none; transition: transform 180ms ease, box-shadow 180ms ease; }
.card-title { color: var(--card-text); position: relative; display: table; font-size: clamp(1.25rem, 1.8vw, 2rem); font-weight: 900; line-height: 1.2; padding: .16em 0; border: 0; background: transparent; margin: 0 auto 1.25rem; }
.card-picture { padding: var(--media-padding); background: var(--media-background); aspect-ratio: 1; }
.card-picture img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card-picture.contain img { object-fit: contain; }
.card-note { font-size: .9rem; text-align: center; margin-block-start: .65rem; }
.project-card:focus-visible, .project-card.is-in-view { transform: translateY(-3px); }
.project-card:active { transform: scale(.98); }
.tags { display: flex; flex-wrap: wrap; gap: .45rem; margin-block: 1rem; }
.tag { color: var(--tag-text); display: inline-flex; align-items: center; min-height: 44px; padding: .25rem .7rem; border: 1px solid currentColor; background: var(--tag-background); text-decoration: none; font-size: 1rem; transition: background 160ms ease, transform 160ms ease; }
.contact { background: var(--contact-background); color: var(--white); padding: clamp(2.5rem, 6vw, 5rem) var(--gutter) 1.5rem; text-align: center; }
.contact h2 { color: var(--contact-title); font-size: clamp(2.5rem, 5vw, 5.5rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.3; white-space: nowrap; }
.smile { display: inline-block; direction: ltr; unicode-bidi: isolate; font-family: "Heebo", sans-serif; letter-spacing: 0; white-space: nowrap; }
.contact-links { display: flex; justify-content: center; gap: clamp(1.2rem, 5vw, 3rem); margin: 1.7rem auto 0; }
.project-page { border: 0; width: min(92vw, 76rem); max-width: none; height: 88dvh; max-height: 88dvh; margin: auto; padding: 0; background: var(--panel-background); color: var(--panel-text); overflow-y: auto; box-shadow: none; transform-origin: center; }
.project-page[open] { display: block; }
.project-page::backdrop { background: rgb(27 16 28 / 55%); backdrop-filter: blur(8px); animation: background-recedes 600ms cubic-bezier(.2,.8,.2,1); }
@keyframes background-recedes { from { background: rgb(27 16 28 / 0%); backdrop-filter: blur(0); } to { background: rgb(27 16 28 / 55%); backdrop-filter: blur(8px); } }
.project-page-header { display: flex; justify-content: flex-end; position: sticky; top: 0; padding: .4rem clamp(1rem, 3vw, 3rem); background: var(--panel-background); z-index: 1; }
.project-page-header button { display: grid; place-items: center; color: var(--close-color); background: transparent; border: 0; margin-inline-end: -.3rem; min-width: 48px; min-height: 48px; font: 800 3.3rem/1 system-ui, sans-serif; }
.project-page-content { max-width: 90rem; margin: auto; padding: clamp(1rem, 3vw, 3rem); }
.project-page h2 { color: var(--name-text); display: table; background: var(--panel-accent, var(--name-background)); padding: .12em .25em; font-size: clamp(2.2rem, 6vw, 5rem); line-height: 1.15; font-weight: 900; }
.project-description { max-width: 48rem; margin-block: 1rem; }
.detail-media { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 1rem; margin-block-start: 2rem; }
.media-item { color: var(--media-text); min-width: 0; padding: var(--media-padding); background: var(--media-background); }
.media-item img, .media-item video { display: block; width: 100%; height: auto; background: var(--media-background); }
.media-item figcaption { font-size: .95rem; padding-block: .45rem; }
.media-item .tags { margin-block: .3rem 1rem; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) {
  .project-card:hover .card-content::after { opacity: 1; }
  .project-card:hover { transform: translateY(-3px); }
  .tag:hover { background: var(--accent-2); color: var(--name-text); transform: translateY(-2px); }
    .carousel:has(.carousel-track:hover) .carousel-track { animation-play-state: paused; }
}
@media (max-width: 48rem) {
  h1 { display: grid; gap: .14em; font-size: clamp(2.7rem, 11vw, 5.3rem); }
  .intro-name { width: 100%; }
  .greeting { width: 100%; }
  .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-intro > p { margin-inline: auto; font-size: clamp(.9rem, 3.9vw, 1.3rem); }
  .hero-intro > p span { display: block; white-space: nowrap; }
  .detail-media { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 34rem) {
  .project-grid, .detail-media { grid-template-columns: 1fr; }
  .contact h2 { white-space: normal; font-size: clamp(2.5rem, 10vw, 3.8rem); }
      }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

.social-icon { position: relative; display: grid; place-items: center; width: clamp(4rem, 10vw, 5.5rem); height: clamp(4rem, 10vw, 5.5rem); color: var(--icon-color); }
.social-icon > svg:not(.pencil-frame) { width: 55%; height: 55%; }
.social-icon { border: 2px solid var(--social-outline); }
.social-icon.has-pencil-frame { border-color: transparent; }
.social-icon > .pencil-frame { position: absolute; inset: -2px; display: block; width: calc(100% + 4px); height: calc(100% + 4px); overflow: visible; pointer-events: none; }
@media (hover: hover) { .social-icon:hover { color: var(--social-outline); } }

.theme-toggle { display: inline-grid; place-items: center; flex: 0 0 80px; width: 80px; min-height: 44px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--page-text); -webkit-appearance: none; appearance: none; }
.theme-toggle-track { position: relative; display: block; width: 76px; height: 36px; border-radius: 999px; background: var(--accent-2); color: var(--name-text); direction: ltr; }
.theme-toggle-thumb { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--page-background); transition: transform 260ms cubic-bezier(.22,1,.36,1); }
.theme-toggle[aria-checked="true"] .theme-toggle-thumb { transform: translateX(40px); }
.theme-toggle svg { position: absolute; top: 9px; width: 18px; height: 18px; pointer-events: none; }
.theme-toggle-sun { left: 9px; }
.theme-toggle-moon { right: 9px; }
.theme-toggle[aria-checked="false"] .theme-toggle-sun, .theme-toggle[aria-checked="true"] .theme-toggle-moon { color: var(--page-text); }
.site-header { position: relative; }
.site-header .theme-toggle { position: absolute; left: 50%; transform: translateX(-50%); box-shadow: none; -webkit-tap-highlight-color: transparent; }
.theme-toggle:focus:not(:focus-visible) { outline: none; }
@media(max-width: 23rem) { .site-header .wordmark { font-size: .78rem; } }
@media(prefers-reduced-motion: reduce) { .theme-toggle-thumb { transition: none; } }

.greeting > span { display: flex; flex: none; direction: rtl; gap: .015em; }
.canva-letter { flex: none; }
.name-line { display: flex; align-items: center; gap: .12em; }
.name:has(.canva-word) { display: flex; align-items: center; line-height: 1; }
#intro-title { display: flex; flex-wrap: nowrap; align-items: center; gap: .22em; }
#intro-title .intro-name { width: auto; }
#intro-title .greeting { width: auto; }

/* Optional solid-color version: ?cards=filled. The outline version stays available. */
:root[data-cards="filled"] .project-card { background: transparent; padding: 0; }
:root[data-cards="filled"] .card-content { position: relative; padding: clamp(1.1rem, 2vw, 1.7rem); }
:root[data-cards="filled"] .card-content::before { content: ""; position: absolute; inset: -5px; background: var(--chalk-fill) center / 100% 100% no-repeat; pointer-events: none; }
:root[data-cards="filled"] .project-card .card-content::after { display: none; }
:root[data-cards="filled"] .card-content > * { position: relative; }
:root[data-cards="filled"] .card-title { color: var(--card-accent); margin-block: 0 1rem; }
.card-title { width: 100%; }
.handwritten-heading { display: block; width: 100%; height: clamp(2.4rem, 3.7vw, 3.4rem); overflow: visible; }

/* Shared square geometry keeps titles outside both variants. */
.card-content { position: relative; aspect-ratio: 1; padding: clamp(1.1rem, 2vw, 1.7rem); }
.card-picture { width: 100%; height: 100%; min-height: 0; }
.card-title { margin-block: 0 1rem; }
.carousel-tile::before { clip-path: none; -webkit-mask: var(--star-shape) center / contain no-repeat; mask: var(--star-shape) center / contain no-repeat; }

/* Thick outline lies over the image rather than outside a padded card. */
.project-card { --outline-width: var(--card-outline-width, 9); }
:root[data-cards="outline"] .card-content { padding: 0; isolation: isolate; }
:root[data-cards="outline"] .card-content::after { inset: 0; z-index: 2; }

:root[data-cards] .card-title { padding-block: 0; margin-block: 0 .3rem; }


/* Solid irregular rings and their photo openings share the same geometry. */
:root[data-cards="outline"] .card-picture { -webkit-mask: var(--picture-mask) center / 100% 100% no-repeat; mask: var(--picture-mask) center / 100% 100% no-repeat; }
.contact h2 { display: block; color: var(--contact-title); }
.contact h2 > .handwritten-heading { width: 100%; height: clamp(4rem, 8vw, 7rem); max-width: 75rem; margin-inline: auto; }
@media(max-width:48rem) { .contact h2 > .handwritten-heading { height: 8.5rem; } }
@media(hover:hover) and (pointer:fine) {
  html, body { cursor: var(--site-cursor, auto); }
  a[href], button, [role="button"], [role="switch"] { cursor: var(--site-cursor-link, pointer); }
}


/* Keep the theme switch centered, with music immediately beside it. */
.header-controls { position: absolute; left: 50%; transform: translateX(-50%); width: 80px; height: 44px; }
#music-toggle { position: absolute; left: calc(100% + .25rem); top: 0; display: grid; place-items: center; width: 44px; height: 44px; padding: .45rem; border: 0; background: transparent; color: var(--page-text); }
#music-toggle svg { width: 26px; height: 26px; overflow: visible; }
#music-toggle[aria-pressed="true"] .music-muted-line { display: none; }
:root[data-cards] .card-title { margin-block-end: -.45rem; }

@media(max-width:23rem) { .site-header { min-height: 104px; padding-block-end: 52px; } .header-controls { top: 52px; } }

/* Supplied English lettering shares the same renderer and theme colors. */
.wordmark .handwritten-heading { width: clamp(7rem, 12vw, 10rem); height: 2rem; }

/* Common lettering scale follows the longest project title at every card width. */
.card-title > .handwritten-heading { height: auto; width: 100%; }

/* Keep the final project row close to the contact section. */
.projects-section { padding-block-end: 1rem; }
.contact { padding-block-start: 1rem; }

/* Larger supplied wordmark; panel silhouette shares the approved card geometry. */
.wordmark .handwritten-heading { width: clamp(8rem, 14vw, 12rem); height: 2.5rem; }
.project-page { clip-path: url(#panel-shape); overflow: hidden; padding: 6dvh 6%; }
.project-page-scroll { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--panel-accent) var(--panel-background); }
.project-page-scroll::-webkit-scrollbar { width: 9px; }
.project-page-scroll::-webkit-scrollbar-track { background: var(--panel-background); }
.project-page-scroll::-webkit-scrollbar-thumb { background: var(--panel-accent); border-radius: 8px; }
.project-page-header { padding-top: 0; }
.project-page-header button svg { width: 42px; height: 42px; }
.project-page h2 { display: block; width: 100%; background: transparent; color: var(--panel-accent); padding: 0; }
.project-page h2 > .handwritten-heading { height: auto; width: 100%; }
.tag { border: 0; padding-inline: .15rem; text-decoration: underline; text-underline-offset: .25em; text-decoration-thickness: 1px; background: transparent; }
@media(hover:hover) { .tag:hover { background: transparent; color: var(--panel-accent, var(--card-accent, var(--accent-2))); } }

/* Tags remain in the content model for later restoration. */
.tags { display: none; }
/* A restrained hand-shaped panel, with the originating card's exact accent. */
.project-page { clip-path: none; border-radius: 2.4% 2.8% 2.2% 2.7% / 3.4% 2.8% 3.2% 2.6%; --panel-background: var(--panel-accent); --panel-text: var(--page-background); --close-color: var(--page-background); padding: 2.5dvh 2%; }
.project-page h2 { color: var(--panel-text); }
.project-page-scroll { scrollbar-color: var(--panel-text) var(--panel-background); }
.project-page-scroll::-webkit-scrollbar-thumb { background: var(--panel-text); }
@media(min-width:49rem) {
  .project-page h2 > .handwritten-heading { width: 100%; height: clamp(3.5rem, 7vw, 6rem); }
}
